// Test file for edition 2023 nullability with different field presence settings

edition = "2023";
package edition2023_nullability;

message TestMessage {
  // Explicit presence fields (default for edition 2023)
  string explicit_string = 1;
  int32 explicit_int32 = 2;
  bool explicit_bool = 3;
  TestMessage explicit_message = 4;
  TestEnum explicit_enum = 5;
  
  // Implicit presence fields (scalar and enum only - messages can't have implicit presence)
  string implicit_string = 11 [features.field_presence = IMPLICIT];
  int32 implicit_int32 = 12 [features.field_presence = IMPLICIT];
  bool implicit_bool = 13 [features.field_presence = IMPLICIT];
  TestEnum implicit_enum = 15 [features.field_presence = IMPLICIT];
  
  // Collections (always non-nullable)
  repeated string repeated_strings = 21;
  repeated int32 repeated_ints = 22;
  repeated TestMessage repeated_messages = 23;
  
  map<string, string> string_map = 31;
  map<int32, int32> int_map = 32;
  map<string, TestMessage> message_map = 33;
  
  // Oneof fields
  oneof test_oneof {
    string oneof_string = 41;
    int32 oneof_int32 = 42;
    TestMessage oneof_message = 43;
  }
}

enum TestEnum {
  TEST_ENUM_UNSPECIFIED = 0;
  TEST_ENUM_VALUE1 = 1;
  TEST_ENUM_VALUE2 = 2;
}

